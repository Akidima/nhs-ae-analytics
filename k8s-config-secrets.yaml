---
# ConfigMap: Airflow environment variables
apiVersion: v1
kind: ConfigMap
metadata:
  name: airflow-config
  namespace: nhs-ae-analytics
data:
  AIRFLOW__CORE__EXECUTOR: "LocalExecutor"
  AIRFLOW__CORE__LOAD_EXAMPLES: "False"
  AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "True"
  # Must match POSTGRES_PASSWORD in airflow-secrets
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql://nhs:nhs_local_pw@postgres:5432/airflow"
  AIRFLOW_HOME: "/opt/airflow"

---
# Secret: local-dev credentials (align with .env.example). Replace in production.
apiVersion: v1
kind: Secret
metadata:
  name: airflow-secrets
  namespace: nhs-ae-analytics
type: Opaque
stringData:
  # Valid Fernet key (same as .env.example); regenerate for production
  AIRFLOW__CORE__FERNET_KEY: "46BKJoQYlPPOexq0OhDZnIlNepKFf87WFwLbfzqDDho="
  POSTGRES_USER: "nhs"
  POSTGRES_PASSWORD: "nhs_local_pw"
  POSTGRES_DB: "nhs_ae"
  AIRFLOW_DB_NAME: "airflow"
  MINIO_ROOT_USER: "minioadmin"
  MINIO_ROOT_PASSWORD: "minioadmin_local_pw"
  AWS_ACCESS_KEY_ID: "minioadmin"
  AWS_SECRET_ACCESS_KEY: "minioadmin_local_pw"
  RAW_BUCKET: "nhs-ae-raw"
  LOCALSTACK_AUTH_TOKEN: ""
  AIRFLOW_WWW_USER_USERNAME: "admin"
  AIRFLOW_WWW_USER_PASSWORD: "admin"
  NHS_AE_DB_URL: "postgresql+psycopg2://nhs:nhs_local_pw@postgres:5432/nhs_ae"

---
# ConfigMap: SQL/shell init for PostgreSQL (mirrors sql/init/)
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-scripts
  namespace: nhs-ae-analytics
data:
  00_create_airflow_db.sh: |
    #!/bin/bash
    set -e
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<-EOSQL
        SELECT 'CREATE DATABASE airflow'
        WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'airflow')\gexec
    EOSQL
    echo "airflow metadata database ensured"
  01_schemas.sql: |
    CREATE SCHEMA IF NOT EXISTS staging;
    CREATE SCHEMA IF NOT EXISTS intermediate;
    CREATE SCHEMA IF NOT EXISTS marts;
    CREATE SCHEMA IF NOT EXISTS meta;
    CREATE SCHEMA IF NOT EXISTS reference;
  02_meta_catalog.sql: |
    CREATE TABLE IF NOT EXISTS meta.source_file (
        source_file_id      BIGSERIAL PRIMARY KEY,
        source_name         TEXT        NOT NULL,
        original_filename   TEXT        NOT NULL,
        resolved_url        TEXT        NOT NULL,
        data_month          DATE,
        publication_date    DATE,
        file_size_bytes     BIGINT,
        sha256              TEXT        NOT NULL,
        schema_version      TEXT,
        raw_storage_path    TEXT        NOT NULL,
        row_count_parsed    INTEGER,
        ingest_status       TEXT        NOT NULL,
        ingested_at         TIMESTAMPTZ NOT NULL DEFAULT now(),
        UNIQUE (source_name, sha256)
    );
    CREATE TABLE IF NOT EXISTS meta.period_version (
        period_version_id   BIGSERIAL PRIMARY KEY,
        source_file_id      BIGINT REFERENCES meta.source_file(source_file_id),
        period              DATE        NOT NULL,
        org_code            TEXT        NOT NULL,
        row_hash            TEXT        NOT NULL,
        valid_from          TIMESTAMPTZ NOT NULL DEFAULT now(),
        valid_to            TIMESTAMPTZ,
        is_current          BOOLEAN     NOT NULL DEFAULT true
    );
    CREATE INDEX IF NOT EXISTS ix_period_version_lookup
        ON meta.period_version (period, org_code, is_current);
    CREATE TABLE IF NOT EXISTS meta.schema_drift_log (
        drift_id            BIGSERIAL PRIMARY KEY,
        source_file_id      BIGINT REFERENCES meta.source_file(source_file_id),
        drift_type          TEXT NOT NULL,
        column_detail       TEXT,
        action_taken        TEXT,
        detected_at         TIMESTAMPTZ NOT NULL DEFAULT now()
    );
    CREATE TABLE IF NOT EXISTS meta.reconciliation_result (
        reconciliation_id   BIGSERIAL PRIMARY KEY,
        period              DATE NOT NULL,
        metric_name         TEXT NOT NULL,
        our_value           NUMERIC,
        published_value     NUMERIC,
        variance            NUMERIC,
        status              TEXT NOT NULL,
        checked_at          TIMESTAMPTZ NOT NULL DEFAULT now()
    );
    CREATE TABLE IF NOT EXISTS meta.pipeline_run (
        run_id              BIGSERIAL PRIMARY KEY,
        dag_run_id          TEXT,
        started_at          TIMESTAMPTZ NOT NULL DEFAULT now(),
        finished_at         TIMESTAMPTZ,
        status              TEXT,
        rows_loaded         INTEGER,
        notes               TEXT
    );
